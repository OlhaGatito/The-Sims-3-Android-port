name: Loader and Port CI
on:
  push:
    branches: [main]
    paths:
      - "loader/**"
      - "scripts/**"
      - "Makefile"
      - "The Sims 3.sh"
      - "nxextract/**"
      - "libs/**"
      - "port.json"
      - "extractor.json"
      - ".github/workflows/build-sims3-loader.yml"
  pull_request:
    branches: [main]
    paths:
      - "loader/**"
      - "scripts/**"
      - "Makefile"
      - "The Sims 3.sh"
      - "nxextract/**"
      - "libs/**"
      - "port.json"
      - "extractor.json"
      - ".github/workflows/build-sims3-loader.yml"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax and project consistency
        run: bash scripts/rebuild-base.sh --check
      - name: Check Python syntax
        run: python3 -c 'import pathlib; [compile(pathlib.Path(p).read_text(), p, "exec") for p in ("nxextract/nxextract.py", "scripts/unpack-s3e.py")]'
      - name: Install ARMv7 smoke-test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf file
      - name: Cross-compile smoke test (not a release build)
        run: |
          mkdir -p build/ci
          make -C loader TARGET="$PWD/build/ci/sims3_s3e_loader" CC=arm-linux-gnueabihf-gcc STRIP=arm-linux-gnueabihf-strip
          readelf -h build/ci/sims3_s3e_loader | grep "Class:.*ELF32"
          readelf -h build/ci/sims3_s3e_loader | grep "Machine:.*ARM"
          readelf -l build/ci/sims3_s3e_loader | grep "/lib/ld-linux-armhf.so.3"
          readelf -A build/ci/sims3_s3e_loader | grep "Tag_ABI_VFP_args: VFP registers"
          readelf -d build/ci/sims3_s3e_loader | grep "(NEEDED)"
