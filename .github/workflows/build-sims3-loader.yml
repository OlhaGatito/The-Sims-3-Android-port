name: Build The Sims 3 ARM loader

on:
  push:
    branches:
      - main
      - codex/sims3-lzma-sdk-decoder-2026-09-30
    paths:
      - "loader/**"
      - "Makefile"
      - ".github/workflows/build-sims3-loader.yml"
  pull_request:
    branches:
      - main
    paths:
      - "loader/**"
      - "Makefile"
      - ".github/workflows/build-sims3-loader.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ARMv7 hard-float toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf

      - name: Build loader
        run: |
          make clean
          make CC=arm-linux-gnueabihf-gcc STRIP=arm-linux-gnueabihf-strip
          file sims3_s3e_loader

      - name: Upload compiled loader
        uses: actions/upload-artifact@v4
        with:
          name: sims3-s3e-loader-armv7-hardfloat
          path: sims3_s3e_loader
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download compiled loader
        uses: actions/download-artifact@v4
        with:
          name: sims3-s3e-loader-armv7-hardfloat
          path: .build-artifact

      - name: Keep the tracked loader binary in sync
        run: |
          cp .build-artifact/sims3_s3e_loader sims3_s3e_loader
          if git diff --quiet -- sims3_s3e_loader; then
            echo "The tracked loader binary is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sims3_s3e_loader
          git commit -m "Build ARMv7 hard-float loader"
          git push origin "HEAD:${GITHUB_REF_NAME}"
